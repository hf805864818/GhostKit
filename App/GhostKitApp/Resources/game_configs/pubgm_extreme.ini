; =============================================================================
; PUBG Mobile - Extreme (极致) Device Profile
; =============================================================================
; 高阴影/高材质/高细节/开启HDR
; 最高画质体验，需要高性能设备
; =============================================================================

[UserCustom DeviceProfile]
DeviceType=IOS
DeviceGroup=IOS_High
BaseProfileName=
bUseDeviceProfile=True

; ── 画质等级 (0=最低, 1=低, 2=中, 3=高, 4=极致) ──────────────────────────
; 阴影质量：高
+CVars=sg.ShadowQuality=3
; 材质质量：高
+CVars=sg.TextureQuality=3
; 特效质量：高
+CVars=sg.EffectsQuality=3
; 植被质量：高 (完整植被渲染)
+CVars=sg.FoliageQuality=3
; 着色质量：高
+CVars=sg.ShadingQuality=3
; 视距质量：高 (远距离细节)
+CVars=sg.ViewDistanceQuality=3
; 后处理质量：高
+CVars=sg.PostProcessQuality=2
; 抗锯齿质量：高
+CVars=sg.AntiAliasingQuality=2

; ── 分辨率与渲染 ──────────────────────────────────────────────────
; 分辨率质量倍率：最高
+CVars=sg.ResolutionQuality=3.0
; 移动端内容缩放因子：最高
+CVars=r.MobileContentScaleFactor=1.0

; ── HDR 设置 ──────────────────────────────────────────────────────
; 开启移动端 HDR 渲染
+CVars=r.MobileHDR=True
; 开启 HDR 显示输出
+CVars=r.HDR.Mobile=True

; ── 性能优化 ──────────────────────────────────────────────────────
; 关闭动态分辨率（保证画质）
+CVars=r.DynamicRes=False
; 动态分辨率目标帧率
+CVars=r.DynamicRes.FrameTimeBudget=16.6
; 环境光遮蔽：高
+CVars=r.AmbientOcclusion.ComputeSmoothingMaxLOD=2
; Bloom 特效：高
+CVars=r.BloomQuality=2
; 镜头光晕：高
+CVars=r.LensFlareQuality=2
; 动态模糊：开启
+CVars=r.MobileMotionBlur=True
; 屏幕空间反射：高
+CVars=r.SSR.Quality=2
; 次表面散射：高
+CVars=r.SSS.Quality=2

; ── 光照与阴影 ────────────────────────────────────────────────────
; 开启移动端动态光照
+CVars=r.MobileDynamicLight=True
; 阴影半径：最大
+CVars=r.Shadow.CSMRadius=4000
; 开启接触阴影
+CVars=r.ContactShadows=True
; 阴影质量：高
+CVars=r.ShadowQuality=3
; 开启远场阴影
+CVars=r.DistantFieldShadows=True

; ── 纹理与材质 ────────────────────────────────────────────────────
; 纹理流送池大小：最大
+CVars=r.Streaming.PoolSize=1000
; 纹理 Mip 偏移：0 (无偏移，最高分辨率)
+CVars=r.MipStreamingLodBias=0.0
; 材质质量级别：高
+CVars=r.MaterialQualityLevel=2

; ── 抗锯齿 ────────────────────────────────────────────────────────
; 开启移动端 FXAA
+CVars=r.Mobile.FXAA=True
; MSAA 采样数：4 (4x)
+CVars=r.MSAACount=4
; 开启时间抗锯齿 (TAA)
+CVars=r.TemporalAA=True

; ── 特效与粒子 ────────────────────────────────────────────────────
; 粒子 LOD 偏移：0 (最高细节)
+CVars=r.ParticleLODBias=0
; 体积雾密度
+CVars=r.FogVolumeDensityScale=1
; 开启体积光
+CVars=r.VolumetricLighting=True

; ── 帧率与垂直同步 ───────────────────────────────────────────────
; 强制帧率上限
+CVars=r.ForceFrameRate=60
; 开启垂直同步
+CVars=r.Vsync=True
; 关闭帧率平滑
+CVars=r.Mobile.FrameRateSmoothing=False


[BackUp DeviceProfile]
DeviceType=IOS
DeviceGroup=IOS_High
BaseProfileName=
bUseDeviceProfile=True

