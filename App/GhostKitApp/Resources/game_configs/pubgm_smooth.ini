; =============================================================================
; PUBG Mobile - Smooth (流畅) Device Profile
; =============================================================================
; 低阴影/低材质/低细节/关闭HDR
; 适合性能较低设备，优先保证帧率流畅
; =============================================================================

[UserCustom DeviceProfile]
DeviceType=IOS
DeviceGroup=IOS_High
BaseProfileName=
bUseDeviceProfile=True

; ── 画质等级 (0=最低, 1=低, 2=中, 3=高, 4=极致) ──────────────────────────
; 阴影质量：最低 (关闭动态阴影)
+CVars=sg.ShadowQuality=0
; 材质质量：低
+CVars=sg.TextureQuality=1
; 特效质量：低
+CVars=sg.EffectsQuality=1
; 植被质量：低 (减少渲染植被)
+CVars=sg.FoliageQuality=1
; 着色质量：低
+CVars=sg.ShadingQuality=1
; 视距质量：低
+CVars=sg.ViewDistanceQuality=1
; 后处理质量：关闭
+CVars=sg.PostProcessQuality=0
; 抗锯齿质量：关闭 (关闭MSAA/FXAA)
+CVars=sg.AntiAliasingQuality=0

; ── 分辨率与渲染 ──────────────────────────────────────────────────
; 分辨率质量倍率：降低分辨率提升帧率 (2.0=最低, 3.0=标准, 4.0=最高)
+CVars=sg.ResolutionQuality=2.0
; 移动端内容缩放因子
+CVars=r.MobileContentScaleFactor=0.8

; ── HDR 设置 ──────────────────────────────────────────────────────
; 关闭移动端 HDR 渲染
+CVars=r.MobileHDR=False
; 关闭 HDR 显示输出
+CVars=r.HDR.Mobile=False

; ── 性能优化 ──────────────────────────────────────────────────────
; 启用动态分辨率
+CVars=r.DynamicRes=True
; 动态分辨率目标帧率
+CVars=r.DynamicRes.FrameTimeBudget=33.0
; 关闭环境光遮蔽
+CVars=r.AmbientOcclusion.ComputeSmoothingMaxLOD=0
; 关闭 Bloom 特效
+CVars=r.BloomQuality=0
; 关闭镜头光晕
+CVars=r.LensFlareQuality=0
; 关闭动态模糊
+CVars=r.MobileMotionBlur=False
; 关闭屏幕空间反射
+CVars=r.SSR.Quality=0
; 关闭次表面散射
+CVars=r.SSS.Quality=0

; ── 光照与阴影 ────────────────────────────────────────────────────
; 关闭移动端动态光照
+CVars=r.MobileDynamicLight=False
; 阴影半径：0 (禁用距离阴影)
+CVars=r.Shadow.CSMRadius=0
; 关闭接触阴影
+CVars=r.ContactShadows=False
; 阴影质量
+CVars=r.ShadowQuality=0
; 关闭级联阴影贴图
+CVars=r.DistantFieldShadows=False

; ── 纹理与材质 ────────────────────────────────────────────────────
; 纹理流送池大小
+CVars=r.Streaming.PoolSize=100
; 纹理 Mip 偏移 (正值=更模糊更低分辨率)
+CVars=r.MipStreamingLodBias=1.0
; 材质质量级别
+CVars=r.MaterialQualityLevel=0

; ── 抗锯齿 ────────────────────────────────────────────────────────
; 关闭移动端 FXAA
+CVars=r.Mobile.FXAA=False
; MSAA 采样数：0 (关闭)
+CVars=r.MSAACount=0
; 关闭时间抗锯齿
+CVars=r.TemporalAA=False

; ── 特效与粒子 ────────────────────────────────────────────────────
; 粒子 LOD 偏移
+CVars=r.ParticleLODBias=2
; 关闭体积雾
+CVars=r.FogVolumeDensityScale=0
; 关闭体积光
+CVars=r.VolumetricLighting=False

; ── 帧率与垂直同步 ───────────────────────────────────────────────
; 强制帧率上限
+CVars=r.ForceFrameRate=60
; 关闭垂直同步 (减少输入延迟)
+CVars=r.Vsync=False
; 启用移动端帧率平滑
+CVars=r.Mobile.FrameRateSmoothing=True


[BackUp DeviceProfile]
DeviceType=IOS
DeviceGroup=IOS_High
BaseProfileName=
bUseDeviceProfile=True

; ── 默认/备份画质等级 ────────────────────────────────────────────
; 阴影质量：中
+CVars=sg.ShadowQuality=2
; 材质质量：中
+CVars=sg.TextureQuality=2
; 特效质量：中
+CVars=sg.EffectsQuality=2
; 植被质量：中
+CVars=sg.FoliageQuality=2
; 着色质量：中
+CVars=sg.ShadingQuality=2
; 视距质量：中
+CVars=sg.ViewDistanceQuality=2
; 后处理质量：中
+CVars=sg.PostProcessQuality=1
; 抗锯齿质量：中
+CVars=sg.AntiAliasingQuality=1

; ── 默认分辨率与渲染 ──────────────────────────────────────────────
+CVars=sg.ResolutionQuality=3.0
+CVars=r.MobileContentScaleFactor=1.0

; ── 默认 HDR 设置 ──────────────────────────────────────────────────
+CVars=r.MobileHDR=True
+CVars=r.HDR.Mobile=True

; ── 默认性能设置 ────────────────────────────────────────────────────
+CVars=r.DynamicRes=False
+CVars=r.DynamicRes.FrameTimeBudget=16.6
+CVars=r.AmbientOcclusion.ComputeSmoothingMaxLOD=2
+CVars=r.BloomQuality=1
+CVars=r.LensFlareQuality=1
+CVars=r.MobileMotionBlur=True
+CVars=r.SSR.Quality=1
+CVars=r.SSS.Quality=1

; ── 默认光照与阴影 ────────────────────────────────────────────────
+CVars=r.MobileDynamicLight=True
+CVars=r.Shadow.CSMRadius=2000
+CVars=r.ContactShadows=True
+CVars=r.ShadowQuality=2
+CVars=r.DistantFieldShadows=True

; ── 默认纹理与材质 ────────────────────────────────────────────────
+CVars=r.Streaming.PoolSize=1000
+CVars=r.MipStreamingLodBias=0.0
+CVars=r.MaterialQualityLevel=1

; ── 默认抗锯齿 ────────────────────────────────────────────────────
+CVars=r.Mobile.FXAA=True
+CVars=r.MSAACount=2
+CVars=r.TemporalAA=True

; ── 默认特效与粒子 ────────────────────────────────────────────────
+CVars=r.ParticleLODBias=0
+CVars=r.FogVolumeDensityScale=1
+CVars=r.VolumetricLighting=True

; ── 默认帧率设置 ──────────────────────────────────────────────────
+CVars=r.ForceFrameRate=60
+CVars=r.Vsync=True
+CVars=r.Mobile.FrameRateSmoothing=False
