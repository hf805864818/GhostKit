# =============================================================================
# GhostKit 自动更新日志工作流
# =============================================================================
# 当代码推送到 main 分支时（忽略 CHANGELOG.md 和 VERSION 文件变更），
# 自动生成更新日志并提交。
# =============================================================================

name: Auto Changelog

# ── 触发条件 ──────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'VERSION'

# ── 权限 ──────────────────────────────────────────────────
permissions:
  contents: write

jobs:
  # ===========================================================================
  # 生成并提交更新日志
  # ===========================================================================
  generate-changelog:
    name: 📝 Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 配置 Git ──────────────────────────────────────
      - name: 🔧 Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # ── 确保脚本可执行 ─────────────────────────────────
      - name: 🔧 Ensure Scripts Executable
        run: |
          chmod +x scripts/version.sh
          chmod +x scripts/changelog.sh

      # ── 读取当前版本号 ─────────────────────────────────
      - name: 📌 Read Version
        id: read_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "当前版本号: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ── 生成更新日志 ───────────────────────────────────
      - name: 📝 Generate Changelog
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          echo "为 v${VERSION} 生成更新日志..."

          # 执行 changelog 脚本（不自动提交，后面统一提交）
          ./scripts/changelog.sh "${VERSION}" --no-commit

          echo "更新日志生成完成"
          echo "--- CHANGELOG.md 前 50 行 ---"
          head -n 50 CHANGELOG.md

      # ── 自动提交 ───────────────────────────────────────
      - name: 💾 Commit Changelog
        run: |
          # 检查是否有变更
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
            echo "## 自动更新日志" >> "$GITHUB_STEP_SUMMARY"
            echo "- 状态: 无变更需要提交" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "docs(changelog): 自动更新日志 [skip ci]"
            git push
            echo "已提交更新日志"
            echo "## 自动更新日志" >> "$GITHUB_STEP_SUMMARY"
            echo "- 状态: ✅ 已提交更新日志" >> "$GITHUB_STEP_SUMMARY"
          fi
